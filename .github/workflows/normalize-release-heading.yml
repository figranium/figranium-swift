name: Normalize release heading
on:
  push:
    paths:
      - .github/workflows/normalize-release-heading.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'RELEASE_NOTES_EOF'
          # v0.3.0
          
          Adds a native async/await interface to Figranium v0.20's Templates API.
          
          ## What's new
          
          - **Catalog:** `try await client.templates.list()` fetches the unpaginated template catalog.
          - **Search and pagination:** `try await client.templates.search(limit: 12, offset: 0, sort: "popular", category: "all", search: "...")` returns a `TemplatePage` containing `items` and `total`.
          - **Template details:** `try await client.templates.get(id)` retrieves a template by ID.
          - **Import tracking:** `try await client.templates.recordImport(id)` reports a successful local import to Figranium.
          
          The new `TemplatesResource` is accessible as `client.templates`. Import tracking is deliberately separate from task creation: save the task first, then record the import. Per-instance download counting is handled by the Figranium server.
          
          See [CHANGELOG.md](https://github.com/figranium/figranium-swift/blob/main/CHANGELOG.md) for release history.
          
          RELEASE_NOTES_EOF
          gh release edit v0.3.0 --notes-file /tmp/release-notes.md
